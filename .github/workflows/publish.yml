name: Publish API Contracts

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com

      - uses: gradle/actions/setup-gradle@v3

      # 1. Generate SDK
      - name: Generate TS SDK
        run: ./gradlew :modules:typescript-client:generateTs

      # 2. Fix tsconfig (IMPORTANT)
      - name: Patch TS config
        run: |
          node -e "
          const fs = require('fs');
          const p = 'modules/typescript-client/build/generated/ts-client/tsconfig.json';
          const c = JSON.parse(fs.readFileSync(p));

          c.compilerOptions.moduleResolution = 'bundler';
          delete c.compilerOptions.outDir;

          fs.writeFileSync(p, JSON.stringify(c, null, 2));
          "

      # 3. Publish raw SDK
      - name: Publish
        working-directory: modules/typescript-client/build/generated/ts-client
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}