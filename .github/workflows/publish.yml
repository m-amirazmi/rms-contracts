name: Generate and Publish API Contracts

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Only needed because Gradle generates TS SDK
      - name: Set up Java (for OpenAPI Generator)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # 1. Generate TS SDK via OpenAPI
      - name: Generate TypeScript SDK
        run: ./gradlew :modules:typescript-client:generateTs

      # 2. Install dependencies inside generated package
      - name: Install dependencies
        working-directory: modules/typescript-client/build/generated/ts-client
        run: npm install

      # 3. Set version from git tag
      - name: Set package version
        working-directory: modules/typescript-client/build/generated/ts-client
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          npm version $VERSION --no-git-tag-version

      # 4. Publish directly with npm (NOT Gradle)
      - name: Publish to GitHub Packages
        working-directory: modules/typescript-client/build/generated/ts-client
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}