name: Generate and Publish TS SDK

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      # =========================
      # Checkout
      # =========================
      - name: Checkout
        uses: actions/checkout@v4

      # =========================
      # Java (only for Gradle OpenAPI generator)
      # =========================
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # =========================
      # Node (for npm publish only)
      # =========================
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com

      # =========================
      # Gradle setup
      # =========================
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # =========================
      # Extract version from git tag
      # =========================
      - name: Set version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      # =========================
      # Generate TS SDK (ZERO BUILD OUTPUT)
      # =========================
      - name: Generate SDK
        run: ./gradlew :modules:typescript-client:generateTs

      # =========================
      # Fix package version
      # =========================
      - name: Set package version
        working-directory: modules/typescript-client/build/generated/ts-client
        run: |
          npm version $VERSION --no-git-tag-version

      # =========================
      # Publish to GitHub Packages
      # =========================
      - name: Publish SDK
        working-directory: modules/typescript-client/build/generated/ts-client
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}