name: Generate and Publish Contracts

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://npm.pkg.github.com'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Generate and Publish Java
        run: ./gradlew :modules:java-server:publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate and Publish TypeScript
        run: ./gradlew :modules:typescript-client:publishTs
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
