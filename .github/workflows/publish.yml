name: Generate and Publish API Contracts

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Only needed because Gradle generates TS SDK
      - name: Set up Java (for OpenAPI Generator)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Generate TypeScript SDK
        run: ./gradlew :modules:typescript-client:generateTs

      - name: Publish to GitHub Packages
        working-directory: modules/typescript-client/build/generated/ts-client
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}